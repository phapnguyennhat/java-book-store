# English (default). messages_vi.properties must have the same keys (checked by MessagesTests).
# Messages with {n} args go through MessageFormat: write a literal ' as ''.

# Problem detail "title", by HTTP status
status.400=Bad Request
status.401=Unauthorized
status.403=Forbidden
status.404=Not Found
status.405=Method Not Allowed
status.406=Not Acceptable
status.409=Conflict
status.413=Content Too Large
status.415=Unsupported Media Type
status.500=Internal Server Error
status.503=Service Unavailable

# Problem detail "detail": problemDetail.<exception class> (codes and args defined by Spring MVC)
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Invalid request content.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Failed to read request: malformed JSON or wrong value type.
problemDetail.org.springframework.beans.TypeMismatchException=Failed to convert ''{0}'' with value: ''{1}''
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Method ''{0}'' is not supported.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Content-Type ''{0}'' is not supported.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException.parseError=Could not parse Content-Type.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Acceptable representations: {0}.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException.parseError=Could not parse Accept header.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Required parameter ''{0}'' is not present.
problemDetail.org.springframework.web.bind.MissingRequestHeaderException=Required header ''{0}'' is not present.
problemDetail.org.springframework.web.bind.MissingRequestCookieException=Required cookie ''{0}'' is not present.
problemDetail.org.springframework.web.bind.MissingPathVariableException=Required path variable ''{0}'' is not present.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=No resource {0}.
problemDetail.org.springframework.web.multipart.MaxUploadSizeExceededException=Maximum upload size exceeded.
error.internal=An unexpected error occurred. Please try again later.

# Validation, per constraint (override per field with <Constraint>.<field>); @Size args: {1}=max, {2}=min
NotBlank=must not be blank
NotNull=must not be null
Email=must be a well-formed email address
Size=size must be between {2} and {1}
Past=must be a past date

# Business errors
auth.invalid-credentials=Invalid credentials
auth.email-taken=Email already registered
