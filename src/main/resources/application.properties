spring.application.name=book-store

# Same .env file that docker-compose.yml reads (resolved from the working directory)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Error bodies as RFC 9457 problem details: shows the reason from ResponseStatusException/validation,
# while unexpected exceptions still go to /error with their message hidden
spring.mvc.problemdetails.enabled=true

# i18n: language from Accept-Language (en, vi); missing header or unknown language -> messages.properties (en),
# never the server's OS locale
spring.web.locale=en
spring.messages.fallback-to-system-locale=false

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
# no DB session held for the whole request: services load what the response needs inside their transaction
spring.jpa.open-in-view=false

# client-supplied page size is capped (Spring Data's own default cap is 2000)
spring.data.web.pageable.max-page-size=100

# API docs / Swagger UI off unless enabled (local: API_DOCS_ENABLED=true in .env); never on in production
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# HS256 signing secret (base64, >= 32 bytes) from .env: openssl rand -base64 48
app.auth.jwt-secret=${JWT_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# S3 for private files (KYC documents), uploaded/downloaded by clients via presigned URLs.
# Empty endpoint = real AWS; locally it points at LocalStack (path-style URLs)
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.region=${S3_REGION}
app.s3.bucket=${S3_BUCKET}
app.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
